# Every tab count, 1 through 5.
#
# This is the regression suite for the bug where the bar always spanned the full
# screen width no matter how many tabs it had. At each count it asserts the
# right tabs are rendered and captures a screenshot; `npm run e2e:measure`
# checks the resulting geometry numerically.
appId: com.magicmax.magictab
---
- launchApp:
    clearState: false
# The app must actually be on screen before anything is asserted. A dev-client
# bundle reload takes tens of seconds on a cold Android emulator, and every step
# before first render sees a black screen with an empty view hierarchy.
- extendedWaitUntil:
    visible:
      id: "tabcount-current"
    timeout: 120000

- runFlow:
    file: helpers/set-tab-count.yaml
    env:
      COUNT: 1
- runFlow:
    file: helpers/assert-tabs-visible.yaml
    env:
      COUNT: 1
- takeScreenshot:
    path: tabs-1

- runFlow:
    file: helpers/set-tab-count.yaml
    env:
      COUNT: 2
- runFlow:
    file: helpers/assert-tabs-visible.yaml
    env:
      COUNT: 2
- takeScreenshot:
    path: tabs-2

- runFlow:
    file: helpers/set-tab-count.yaml
    env:
      COUNT: 3
- runFlow:
    file: helpers/assert-tabs-visible.yaml
    env:
      COUNT: 3
- takeScreenshot:
    path: tabs-3

- runFlow:
    file: helpers/set-tab-count.yaml
    env:
      COUNT: 4
- runFlow:
    file: helpers/assert-tabs-visible.yaml
    env:
      COUNT: 4
- takeScreenshot:
    path: tabs-4

- runFlow:
    file: helpers/set-tab-count.yaml
    env:
      COUNT: 5
- runFlow:
    file: helpers/assert-tabs-visible.yaml
    env:
      COUNT: 5
- takeScreenshot:
    path: tabs-5
