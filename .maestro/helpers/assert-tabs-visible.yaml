# Asserts exactly which tabs the bar shows at a given count.
#
# The demo renders `tabs.slice(0, COUNT)`, so tab N is present iff N <= COUNT.
# Every tab is checked in both directions — present ones visible, the rest gone —
# which is what catches a bar that quietly keeps rendering hidden tabs.
#
# Params:
#   COUNT — the tab count currently applied (1-5).
appId: com.magicmax.magictab
---
- assertVisible:
    id: "tab-home"

- runFlow:
    when:
      true: ${COUNT >= 2}
    commands:
      - assertVisible:
          id: "tab-expenses"
- runFlow:
    when:
      true: ${COUNT < 2}
    commands:
      - assertNotVisible:
          id: "tab-expenses"

- runFlow:
    when:
      true: ${COUNT >= 3}
    commands:
      - assertVisible:
          id: "tab-alerts"
- runFlow:
    when:
      true: ${COUNT < 3}
    commands:
      - assertNotVisible:
          id: "tab-alerts"

- runFlow:
    when:
      true: ${COUNT >= 4}
    commands:
      - assertVisible:
          id: "tab-budgets"
- runFlow:
    when:
      true: ${COUNT < 4}
    commands:
      - assertNotVisible:
          id: "tab-budgets"

- runFlow:
    when:
      true: ${COUNT >= 5}
    commands:
      - assertVisible:
          id: "tab-account"
- runFlow:
    when:
      true: ${COUNT < 5}
    commands:
      - assertNotVisible:
          id: "tab-account"
